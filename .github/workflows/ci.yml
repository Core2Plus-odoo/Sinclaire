name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version check diffs against the base branch, which a shallow
          # checkout cannot see.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tooling
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Validate Odoo manifests and XML
        run: python tools/validate_manifests.py

      - name: Test the repo's own tooling
        run: python -m unittest discover -s tools/tests -v

      - name: Module versions bumped where source changed
        run: python tools/check_version_bumps.py
