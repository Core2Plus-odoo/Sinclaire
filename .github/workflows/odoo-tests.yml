# Integration tests: installs every sinclaire_* addon into a throwaway database
# and runs its Odoo test suite.
#
# This is the gate that matters. The lint job cannot see an install failure -
# a field renamed between Odoo series (res.groups.category_id -> privilege_id
# in 19.0, for instance) passes every static check and still breaks `-i`.
#
# NOTE: the public `odoo:19.0` image ships Community only. A module that depends
# on an Enterprise app (account_accountant, sale_subscription, documents, ...)
# will fail to install here. When that happens, either mount the Enterprise
# addons from a private source onto the addons-path below, or restrict `--init`
# to the Community-only subset.
name: Odoo tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Install & test addons
    runs-on: ubuntu-latest
    container:
      image: odoo:19.0
      options: --user root

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Collect addon names
        id: addons
        run: |
          names=$(find addons -mindepth 2 -maxdepth 2 -name __manifest__.py \
            -printf '%h\n' | xargs -r -n1 basename | sort | paste -sd, -)
          # Restrict the run to OUR tests. Without this, --test-enable also runs
          # the suite of every dependency Odoo pulls in (base, web, bus, ... -
          # ~1500 core tests, many of them browser tours that cannot pass in
          # this container). The install itself still validates our data files.
          tags=$(echo "$names" | tr ',' '\n' | sed 's|^|/|' | paste -sd, -)
          echo "names=${names}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Addons to install: ${names:-<none>}"
          echo "Test tags: ${tags:-<none>}"

      - name: Install addons and run tests
        if: steps.addons.outputs.names != ''
        env:
          PGHOST: db
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          odoo \
            --db_host="$PGHOST" --db_user="$PGUSER" --db_password="$PGPASSWORD" \
            --database=sinclaire_ci \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,"$GITHUB_WORKSPACE/addons" \
            --init="${{ steps.addons.outputs.names }}" \
            --test-enable \
            --test-tags="${{ steps.addons.outputs.tags }}" \
            --log-level=test \
            --without-demo=all \
            --stop-after-init \
            --max-cron-threads=0
