# Integration tests: installs every sinclaire_* addon into a throwaway database
# and runs its Odoo test suite.
#
# This is the gate that matters. The lint job cannot see an install failure -
# a field renamed between Odoo series (res.groups.category_id -> privilege_id
# in 19.0, for instance) passes every static check and still breaks `-i`.
#
# Demo data is loaded on purpose (19.0 needs --with-demo explicitly; it is no
# longer the default). Our demo files are shipped deliverables, so they have to
# be exercised here or a broken one would sail through green.
#
# NOTE: the public `odoo:19.0` image ships Community only, so a module depending
# on an Enterprise app (sale_subscription, account_accountant, documents, ...)
# cannot be installed here. tools/ci_addons.py resolves each addon's dependency
# tree and skips those, naming them in the job log rather than failing the run.
# Mount the Enterprise addons onto the addons-path below to cover them too.
name: Odoo tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Install & test addons
    runs-on: ubuntu-latest
    container:
      image: odoo:19.0
      options: --user root

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Select installable addons
        id: addons
        run: |
          python3 tools/ci_addons.py \
            --addons-path "$CORE_ADDONS,$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
        env:
          CORE_ADDONS: /usr/lib/python3/dist-packages/odoo/addons

      - name: Install addons and run tests
        if: steps.addons.outputs.names != ''
        env:
          PGHOST: db
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          odoo \
            --db_host="$PGHOST" --db_user="$PGUSER" --db_password="$PGPASSWORD" \
            --database=sinclaire_ci \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,"$GITHUB_WORKSPACE" \
            --init="${{ steps.addons.outputs.names }}" \
            --test-enable \
            --test-tags="${{ steps.addons.outputs.tags }}" \
            --log-level=test \
            --with-demo \
            --stop-after-init \
            --max-cron-threads=0
