[tool.ruff]
# 120 matches Odoo core and the OCA pylint-odoo default.
line-length = 120
target-version = "py312"
extend-exclude = ["setup/", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = [
    # Odoo manifests and models legitimately shadow/extend builtins and use
    # class attributes that look unused to static analysis.
    "B008",
    "RUF012",
    # User-facing strings use typographic dashes on purpose (e.g. "Unit 101 - Tower").
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Manifests are bare dicts evaluated by Odoo, not importable modules.
"**/__manifest__.py" = ["B018"]
# Odoo's module loader relies on star-free but order-dependent imports.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["odoo"]
# Odoo package __init__ files list one module per line. Collapsing them
# into a single `from . import a, b, c` hides edits: a line-based removal
# silently no-ops and the deleted module stays imported.
force-single-line = true
